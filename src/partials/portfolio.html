<section id="portfolio" class="portfolio">
  <div class="portfolio-container">
    <div class="portfolio-info">
      <p class="portfolio-title direct" data-endpoint="video/video">
        Beispiele aus der Praxis
      </p>
      <h2 class="portfolio-subtitle">
        So sehen <span>One Lean Filme</span> aus
      </h2>
      <p class="portfolio-description">
        Unsere One Lean Filme kombinieren
        <strong>kreative Exzellenz</strong> mit Verkaufspsychologie –
        <strong
          >so überzeugst du deine Zielgruppe in nur 60 Sekunden und erhältst
          täglich neue Anfragen für dein Unternehmen.</strong
        >
      </p>
    </div>
    <div class="gallery-container">
      <div class="gallery-dropdown-container">
        <button
          type="button"
          class="gallery-dropdown-button"
          id="categories-button"
          aria-label="select categories"
        >
          <span class="gallery-dropdown-title"
            >Klicke hier für mehr Videos</span
          >
        </button>
        <ul class="gallery-categories hidden" id="video-categories"></ul>
      </div>
      <div class="gallery-wrap">
        <button
          class="formular-link"
          id="portfolio-prev-btn"
          aria-label="button prev"
        >
          ← <span class="span-btnNav">Prev</span>
        </button>
        <ul class="gallery-list" id="videos"></ul>
        <button
          class="formular-link"
          id="portfolio-next-btn"
          aria-label="button next"
        >
          <span class="span-btnNav">Next </span>→
        </button>
      </div>
      <div id="pagination">
        <div id="portfolio-dots"></div>
      </div>
    </div>
    <a
      href="#formular-modal"
      class="formular-link"
      aria-label="link to formular form"
    >
      <span class="formular-link-title">Erstgespräch buchen</span>
    </a>
  </div>
</section>
