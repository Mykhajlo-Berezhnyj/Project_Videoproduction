<header id="header" class="header">
  <div id="header-menu" class="header-container">
    <a href="#hero" class="header-logo-link direct" data-endpoint="">
      <img src="/img/logo-x.png" alt="logo" height="34px" class="header-logo" />
    </a>

    <nav id="nav" class="header-navigation">
      <ul class="header-navigation-list">
        <li>
          <a
            href="#services"
            class="header-navigation-link"
            aria-label="link to section services"
            >Dienstleistungen</a
          >
        </li>
        <li>
          <a
            href="#problems"
            class="header-navigation-link"
            aria-label="link to section problems"
            >Lösungen</a
          >
        </li>

        <li>
          <a
            href="#advantages"
            class="header-navigation-link"
            aria-label="link to section advantages"
            >Benefits</a
          >
        </li>

        <li>
          <a
            href="#our_company"
            class="header-navigation-link"
            aria-label="link to section our_company"
            >Über uns</a
          >
        </li>
      </ul>
      <div class="header-formular-link-thumb">
        <button
          href="#formular-modal"
          class="formular-link"
          aria-label="Melden Sie sich für eine Erstberatung an"
          data-action="openForm"
        >
          <!-- deleted class="header-formular-link" -->
          <span class="formular-link-title">Erstgespräch buchen</span>
        </button>
      </div>
    </nav>
    <button
      id="menu-btn"
      class="header-navigation-btn"
      type="button"
      aria-label="Öffnen Sie das Navigationsmenü"
      title="Öffnen Sie das Navigationsmenü"
    ></button>
    <ul class="header-contacts-list">
      <li>
        <a
          href="mailto:xora.office@gmail.com"
          class="header-contacts-link mail"
          aria-label="Schreiben Sie uns einen email Brief"
          title="Schreiben Sie uns einen email Brief"
        >
          <svg width="20">
            <use href="/img/sprite.svg#icon-envelop" />
          </svg>
        </a>
      </li>
      <li>
        <a
          href="https://www.instagram.com/xora_media?igsh=MXYxcTg1eGh0djR4ZQ=="
          class="header-contacts-link insta"
          target="_blank"
          aria-label="Besuchen Sie die Instagram-Seite von Xora Media"
          title="Besuchen Sie die Instagram-Seite von Xora Media"
          rel="noopener noreferrer"
        >
          <svg width="20">
            <use href="/img/sprite.svg#icon-instagram" />
          </svg>
        </a>
      </li>
    </ul>
  </div>
</header>
