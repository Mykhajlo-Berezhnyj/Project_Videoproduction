<section id="formular-modal" class="formular-class-modal">
  <div class="formular-modal-content">
    <h2 class="formular-title">Kostenloses Gespräch sichern</h2>
    <button
      type="button"
      class="close-button"
      aria-label="Schließen Sie die Form"
      title="Schließen Sie die Form"
    >
      <svg class="close" width="24" height="24">
        <use href="/img/sprite.svg#icon-plus"></use>
      </svg>
    </button>
    <form
      id="inquiry-form"
      action="https://formspree.io/f/xlgzwbng"
      method="POST"
      class="formular-container"
    >
      <div class="inputblock">
        <div class="formular-input-group">
          <label class="formular-label" for="name">Dein Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Max Mustermann"
          />
        </div>
        <div class="formular-input-group">
          <label class="formular-label" for="company">Firma</label>
          <input
            type="text"
            id="company"
            name="company"
            placeholder="Deine Firma"
          />
        </div>
        <div class="formular-input-group">
          <label class="formular-label" for="email">E-Mail</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Deine E-Mail-Adresse"
          />
        </div>
      </div>

      <div class="inputblock">
        <div class="formular-input-group">
          <label class="formular-label" for="phone">Telefon</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            placeholder="+49 123 4567890"
          />
        </div>
        <div class="formular-input-group">
          <label class="formular-label" for="message">Frage</label>
          <textarea
            id="message"
            name="message"
            rows="3"
            placeholder="Deine Frage..."
          ></textarea>
        </div>
      </div>
      <button
        type="submit"
        class="formular-cta-button formular-link"
        aria-label="send form"
      >
        <span class="formular-link-title"> Erstgespräch buchen </span>
      </button>
    </form>
  </div>
</section>
